# Build tarball có phiên bản khi đẩy tag v*, đăng lên Generic Package Registry
# của repo (tải công khai, không cần token):
#   https://gitlab.com/api/v4/projects/<id>/packages/generic/editor/<tag>/nextlms-scratch-<tag>.tar.gz
stages: [build]

build:
  stage: build
  image: node:22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - npm ci --no-audit --no-fund
    - npm run fetch-library
    - VERSION="${CI_COMMIT_TAG#v}" npm run build
    - |
      for f in nextlms-scratch-*.tar.gz nextlms-scratch-*.tar.gz.sha256; do
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/editor/$CI_COMMIT_TAG/$f"
      done
  artifacts:
    paths: [nextlms-scratch-*.tar.gz.sha256]
    expire_in: 1 year
